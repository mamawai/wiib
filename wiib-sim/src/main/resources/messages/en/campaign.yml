# Campaign wording (check-in / voting / claiming / settlement). Everything under settle is admin-only.
campaign:
  notRunning: The campaign has not started or is already over
  notStarted: The campaign has not started yet
  ended: The campaign is over
  settling: The campaign is being settled - no more entries
  checkedIn: You already checked in today

  vote:
    unsupportedSymbol: That is not one of the vote symbols
    badDirection: Direction must be UP or DOWN
    alreadyVoted: You already voted on {{symbol}} for UTC {{day}} - it is long or short, not both
    lockWindow: Settlement lock-out - between UTC 23:55 and 00:05 the daily candle rolls over and vote settlement is writing results, so no votes are taken for those 10 minutes. Try again shortly
    # Symbol display names, for backend wording only (alreadyVoted above); card titles use the frontend's market:coinName.*
    symbol:
      BTCUSDT: BTC
      XAUUSDT: Gold

  claim:
    disabled: Payouts are not enabled
    notSettled: The campaign is not settled yet, so there is nothing to claim
    nothingToClaim: You have no reward to claim
    alreadyClaimed: You already claimed this
    inProgress: Your last claim is still being processed - check back shortly
    windowClosed: The claim window has closed - contact an administrator
    accountMismatch: The authorised LinuxDo account is not the one you are signed in as - authorise with your own account
    stateChanged: The claim state changed - refresh and try again
    payoutError: The payout hit an error - try again shortly
    # {{reason}} is whatever the payout channel returned, passed through untranslated
    payoutFailed: "Payout failed: {{reason}}"
    authFailed: "Authorisation failed: {{reason}}"
    authNoToken: "Authorisation failed: no access_token came back"
    userInfoFailed: "Could not fetch the LinuxDo user info: {{reason}}"
    userInfoEmpty: "Could not fetch the LinuxDo user info: the id is empty"

  # Settlement is an admin action; these all exist to stop a mistaken one
  settle:
    noCampaign: There is no campaign to settle
    noEligibleUsers: No user meets the claim criteria, so there is nothing to settle
    sumMismatch: "The settled total {{sum}} does not match the prize pool {{pool}}; rolled back. If the pool has fractional cents, round it to two decimals first"
    notEndedYet: The campaign has not ended yet ({{endAt}}) - settling now would split the whole pool on half-time scores
    votesPending: "Some votes are still unsettled: {{pending}}. Wait for the UTC 00:05 sweep to close those days out, otherwise their points count as 0"
