# 快讯打标域词表（中文）。目录 zh 是语言码，PromptCatalog 按 prompts/<语言>/<域>.yml 装配。
#
# 这里有两件事，不要混为一谈：
#  * 译文是哪门语言——固定英文，两份文案里都写死。打标是平台后台任务（模型取自 ai_runtime_config），
#    没有"当前用户"，不跟 user.lang 走。
#  * 提示词本身用哪门语言——NewsTagger 里的一个常量，当前取 en 那份：整篇英文是"译文写英文"
#    最稳的信号。这份中文版是同一件活的中文写法，换常量即换过来。
news:

  # 一次轻模型调用同时出标签与译文。{{vocabulary}}=封闭词表，{{flashes}}=本批快讯，一条一行
  tagging: |-
    你是金融新闻分类器，同时负责把快讯译成英文。对下面每条快讯做两件事。

    1. 打标——判断它与哪些标的明确相关，只许从这个词表里选（可多选）：
    {{vocabulary}}
       - BTC 代表比特币或加密货币大盘整体方向的消息；只涉某个山寨币自身的消息不算
       - OIL=原油，GOLD=黄金；美股代码只在消息明确涉及该公司时才选
       - 判断不出或与词表标的都无关，tags 给空数组，不要猜：标错就是在 K 线上挂错图标，比不挂更误导

    2. 翻译——把标题与正文译成自然的英文。原文写什么译什么：不概括、不补充、不评论，
       数字/代码/专有名词照抄。某条译不出就整个字段不给，不要把中文原样填回去——
       调用方分得清"字段空着"与"译文"，却分不清"中文冒充英文"与"本来就没译"。

    只输出 JSON 数组，不要任何其他文字，格式：
    [{"id":快讯id,"tags":["BTC"],"title_en":"...","content_en":"..."},{"id":快讯id,"tags":[],"title_en":"...","content_en":"..."}]

    快讯列表：
    {{flashes}}

  # {{flashes}} 里的一条一行。这里的小标签必须跟提示词同语言——英文提示词里插中文段名，
  # 产出语言就是从这种地方开始飘的
  flashLine: "id={{id}} 标题：{{title}} 正文：{{content}}"
