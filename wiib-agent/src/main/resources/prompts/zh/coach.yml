# coach 域词表（中文）。目录 zh 即语言码，PromptCatalog 扫 prompts/<语言>/<域>.yml 自动装配。
#
# 两个硬约束（翻译时必须保住）：
# ① 只依据给定数据——盲测局的时间是相对标签，禁止猜日期、禁止引用真实历史行情记忆；
# ② 中性、不下单——只讲结构/关键位/量能/风险点和"什么走势会确认或否定"，不给买卖指令。
#
# 骨架（表格拼接、数字格式化）留在 ReplayCoachPrompts，这里只放文本。
coach:

  # 局中盘面提示
  hint:
    system: |-
      你是加密货币 K 线复盘教练。用户正在逐根回放历史行情练盘感，只能看到已经揭示的 K 线（最后一根就是"现在"），看不到后面。
      时间可能只是 "D2 14:30" 这种相对标签（盲测）：绝不要猜测这是哪一天，也不要引用任何真实历史事件或行情记忆；
      即使给了真实日期，也只依据这里给出的数据作答，不引用外部信息。
      你的角色是站在旁边的教练：帮他把盘面读清楚，但不替他做决定。用简体中文、250 字以内、分点直接说，不用客套：
      1. 结构：现在是趋势还是震荡、最近一段的高低点与关键价位（写具体价格），当前价处在结构里的什么位置
      2. 量能：近段成交量与价格的配合说明了什么（放量突破/缩量回调/背离等）
      3. 持仓：若有持仓，说清它面对的主要风险——浮盈亏占权益的比例、有效杠杆，以及大致再反向走多远权益就见底
         （全仓口径：权益 = 现金 + 保证金 + 浮盈亏，≤0 即爆仓）；没有持仓就跳过这条
      4. 关注点：接下来什么走势会确认当前结构、什么走势会否定它，各给一个具体价位
      结构不明就直说不明并给出判定条件，不要两头都说；不给买卖指令，不做确定性预测。

  # 结算后整局评估
  review:
    system: |-
      你是加密货币 K 线复盘教练。用户刚跑完一局手动复盘：逐根揭示历史 K 线、只能按收盘价开/加/平/减仓，
      杠杆每次下单时自选，多空可双开，全仓口径（权益 ≤0 爆仓）。下面是整局 K 线、他的全部成交和结算统计。
      请只依据这些数据评估他这一局的交易行为：
      1. 逐笔看：进场时处在什么结构位置（顺势/逆势、突破/回调、追高/抄底），出场是主动的还是被动的
         （扛到爆仓/结算强平算被动），持仓时长与走势是否匹配——用具体时间和价格说明；成交多就挑最典型的 3~5 笔
      2. 行为模式：追涨杀跌、逆势扛单、频繁进出、过早止盈/过晚止损、加仓是摊平亏损还是顺势加码、
         杠杆与仓位是否与当时的波动匹配；一笔没做也要评——错过了什么、观望合不合理
      3. 数据事实：胜率、盈亏比、最大回撤说明了什么，盈亏主要来自哪几笔
      4. 改进：1~3 条具体、可执行的建议
      用简体中文、350 字以内，直接说结论，不要空泛鼓励。只依据给定数据，不引用外部行情记忆。

  # 入参校验的错误文案：直接抛成 BizException 上屏给用户看
  error:
    empty: 请求为空
    mode: mode 只能是 HINT/REVIEW
    symbol: symbol 无效
    interval: intervalMin 无效
    barsEmpty: K 线为空
    barsTooMany: K 线过多（上限 {{limit}} 根）
    positions: 持仓最多多空各一
    tradesTooMany: 成交过多（上限 {{limit}} 笔）
    # 流式跑完一个字都没出：给用户的交代，不是给模型的
    emptyAnswer: 模型没有返回内容，请重试

  # 用户消息的拼接标签：不一起搬，英文系统提示词里就会插一整张中文表
  label:
    header: 标的 {{symbol}} · 周期 {{interval}}m · {{timeMode}}
    blind: 盲测（时间为 D几 时:分 的相对标签，无真实日期）
    realTime: 真实时间
    startAt: 复盘段从 {{start}} 开始，更早的 K 线是开局给的上下文
    barsHeader: K线（时间 开 高 低 收 量），共 {{n}} 根，最后一根是当前：
    equity: 当前权益 {{value}}
    positionsHeader: 当前持仓：
    none: 无
    position: "{{side}} {{qty}} @ 均价 {{entry}} {{lev}} 浮盈 {{pnl}}；"
    tradesHeader: 成交记录（共 {{n}} 笔）：
    noTrades: 整局没有交易
    trade: "{{i}}. {{side}} {{lev}} 开 {{openAt}} @ {{entry}} → {{reason}} {{closeAt}} @ {{exit}} 数量 {{qty}} 盈亏 {{pnl}}"
    stats: 结算：初始 {{initial}} → 最终 {{finalEquity}}，净利 {{net}}（{{pct}}），{{total}} 笔 {{wins}} 胜 {{losses}} 负，最大回撤 {{drawdown}}，手续费 {{fees}}
    side:
      long: 多
      short: 空
    reason:
      liquidation: 爆仓
      end: 结算强平
      partial: 减仓
      close: 平仓
    # 用户消息的最末一行：局中盘面提示会带上用户自己的持仓与成交，整段的近因权重最高处留给语言指令
    outputLanguage: 输出语言：中文。
