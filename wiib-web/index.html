<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <!-- ===== 开屏动画（噪点场 + 先写w后画圈两笔）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #fafaf7 }
      html.dark { background: #0f1012 }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --c-bg: #fafaf7; --c-cell: #e7e7e2;
        --c-pri: #f25f0a; --c-mut: #7a7e88;
      }
      html.dark #splash {
        --c-bg: #0f1012; --c-cell: #26282d;
        --c-pri: #f97316; --c-mut: #8b8e97;
      }
      /* 退场：整块淡出，一开始就放行点击 */
      #splash.sp-out { pointer-events: none; opacity: 0; transition: opacity .5s ease }

      /* 一张 canvas 全包：不透明底色遮页面 + 背景噪点 + 标志，同一介质 */
      #sp-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block }

      /* 标签的淡入由 JS 在画完后驱动，位置也由 JS 定（要贴着标志下沿） */
      .sp-lbl {
        position: absolute; left: 50%; translate: -50%; white-space: nowrap;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        font-size: 10px; letter-spacing: .12em; font-weight: 700;
        color: var(--c-mut); opacity: 0;
      }
      .sp-lbl b { color: var(--c-pri) }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 语言也得在这儿定：开屏跑在 bundle 之前，i18n 还不存在，但开屏上有话要说。
        // 判定复刻 src/i18n/index.ts 那套（localStorage 的 wiib-lang 优先，没选过就看
        // 浏览器语言、zh-* 算中文其余算英文），两处必须同规则，否则开屏与应用会说两种语言
        var lang = localStorage.getItem('wiib-lang');
        if (lang !== 'zh' && lang !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          lang = nav.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }
        window.__wiibLang = lang;
        // 标签页语言从第一帧就对：浏览器断词与读屏软件都认它（bundle 起来后 i18n 会接着维护）
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0f1012' : '#fafaf7');
        }
      })();
    </script>
  </head>

      <div class="sp-lbl">GRID ONLINE <b>·</b> <span id="sp-tail"></span></div>
    </div>

        // 编排装配：第一笔 W = w 主体接斜杠上段（RIGHT 尾段反转），第二笔 RING = 圈（反转裁掉斜杠段）。

          if (rmask.naturalWidth) {
            rtx.setTransform(1, 0, 0, 1, 0, 0);
            rtx.clearRect(0, 0, rtC.width, rtC.height);
            rtx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
            rtx.drawImage(rmask, RT.x, RT.y, RT.w, RT.h);
          }
        }

        // ---- 背景噪点场 ----
        function hs(x, y) { var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
        function smo(t) { return t * t * (3 - 2 * t); }
        function vn(x, y) {
          var xi = Math.floor(x), yi = Math.floor(y), xf = smo(x - xi), yf = smo(y - yi);
          return (hs(xi, yi) * (1 - xf) + hs(xi + 1, yi) * xf) * (1 - yf)
               + (hs(xi, yi + 1) * (1 - xf) + hs(xi + 1, yi + 1) * xf) * yf;
        }
        function noise(t, PRI, CELL) {
          for (var ry = 0; ry < rows; ry++) {
            var y = ry * C, nyc = y / vh - 0.5;
            for (var rx = 0; rx < cols; rx++) {
              var n = vn(rx * 0.10 - t * 0.55, ry * 0.16);
              if (n < 0.60) continue;
              var a = Math.min((n - 0.60) / 0.40, 1) * 0.85;
              var cd = Math.hypot(rx * C / vw - 0.5, nyc);
              a *= 0.22 + 0.78 * smo(Math.min(Math.max((cd - 0.16) / 0.30, 0), 1));
              ctx.globalAlpha = a;
              ctx.fillStyle = hs(rx * 3.7, ry * 9.1) > 0.995 ? PRI : CELL;   // 千分之五的橙点提神
              ctx.fillRect(rx * C, y, C - 1, C - 1);                        // 留 1px 缝，颗粒清爽
            }
          }
          ctx.globalAlpha = 1;
        }

        function at(pts, f) {
          var n = pts.length - 1, i = Math.floor(Math.min(f, n)), r = Math.min(f, n) - i;
          if (i >= n) return pts[n];
          return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r];
        }

        // ---- 把折线画到 p（0~1）处 ----
        // soft：笔迹实画到 f-δ，最前端换径向渐变软帽——揭示前沿像墨水洇进纸面；
        // 画满（p>=1）收成实帽，保证最终帧完整盖住 logo
        function stroke(g, pts, p, w, soft) {
          if (p <= 0) return;
          var n = pts.length - 1, f = Math.min(p, 1) * n;
          var softOn = soft && p < 1;
          var solidF = softOn ? f - Math.min(w * 0.35 / N.sp, f) : f;
          if (solidF > 0.001) {
            var i = Math.floor(solidF), r = solidF - i, k;
            g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#000';
            g.beginPath();
            g.moveTo(pts[0][0], pts[0][1]);
            for (k = 1; k <= Math.min(i, n); k++) g.lineTo(pts[k][0], pts[k][1]);
            // 末点落在两个采样点中间，补一段到插值位置——否则笔迹是逐点跳不是连续推进
            if (i < n) g.lineTo(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
            g.stroke();
          }
          if (softOn) {
            var tp = at(pts, f), R = w * 0.55;
            var gr = g.createRadialGradient(tp[0], tp[1], 0, tp[0], tp[1], R);
            gr.addColorStop(0, 'rgba(0,0,0,1)');
            gr.addColorStop(0.5, 'rgba(0,0,0,.9)');
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = gr;
            g.beginPath(); g.arc(tp[0], tp[1], R, 0, 6.2832); g.fill();
          }
        }

        function seg(p, f) { return f <= 0 ? 1 : Math.min(p / f, 1); }

        // 抠两块禁区：交叉附近那段斜杠带（平头收口，不顺中线两端多啃）+ 竖杆的全部像素
        function eraseZones() {
          var i;
          mx.globalCompositeOperation = 'destination-out';
          mx.lineWidth = DATA.ew; mx.lineCap = 'butt'; mx.lineJoin = 'round'; mx.strokeStyle = '#000';
          mx.beginPath();
          mx.moveTo(EZ[0][0], EZ[0][1]);
          for (i = 1; i < EZ.length; i++) mx.lineTo(EZ[i][0], EZ[i][1]);
          mx.stroke();
          mx.setTransform(1, 0, 0, 1, 0, 0);
          mx.drawImage(bmC, 0, 0);
          mx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
        }

        // 竖杆单独一层：笔迹被自己的遮罩裁一次，不糊到环上。
        // 笔加宽 20%——竖杆最外侧像素离中线 39px，笔半径 40 刚好压线，遮罩又外扩 1px，
        // 不加宽会沿边留一道没盖到的白丝；反正被遮罩裁着，宽点无害
        function bladeLayer(pb) {
          bx.setTransform(1, 0, 0, 1, 0, 0);
          bx.clearRect(0, 0, bc.width, bc.height);
          bx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
          stroke(bx, N.BLADE, pb, PEN * 1.2, true);
          bx.setTransform(1, 0, 0, 1, 0, 0);
          bx.globalCompositeOperation = 'destination-in';
          bx.drawImage(bmC, 0, 0);
          bx.globalCompositeOperation = 'source-over';
          mx.setTransform(1, 0, 0, 1, 0, 0);
          mx.drawImage(bc, 0, 0);
          mx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
        }

        function drawMark(prog) {
          if (!logo.naturalWidth) return;
          mx.setTransform(1, 0, 0, 1, 0, 0);
          mx.clearRect(0, 0, mc.width, mc.height);
          mx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);   // 换算到标志像素空间
          var wp = Math.min(prog / N.wEnd, 1);               // 第一笔（w+斜杠）分段进度
          var rp = (prog - N.wEnd) / (1 - N.wEnd);           // 第二笔（圈）分段进度
          // ① w 前段：进斜杠之前；圈前段：起笔时斜杠已画完，无需禁区
          stroke(mx, N.W1, seg(wp, N.lspW), PEN, true);
          if (rp > 0) stroke(mx, N.RING1, seg(rp, N.rspN), PEN, true);
          // ② 抠禁区。抠完一律加性叠加：遮罩边是半透明的，被抠那层剩 (1-a)、补回那层是 a，
          //    source-over 叠出来只有 1-a+a**2（最低 0.75）——亮底看不出，暗底就是一条黑裂纹
          eraseZones();
          mx.globalCompositeOperation = 'lighter';
          // ③ 竖杆：圈笔过杆顶后向下分叉，同笔速
          var pb = (prog - N.forkAt) / N.SPAN_B;
          if (pb > 0) bladeLayer(pb);
          // ④ w 后段：笔已上斜杠，一路写到顶端交接点
          if (wp > N.lspW) stroke(mx, N.W2, seg(wp - N.lspW, 1 - N.lspW), PEN, true);
          // ⑤ 圈尾：w 笔的斜杠笔帽啃到的圈尾边逐像素抠掉（斜杠自身像素不碰），圈笔进尾段后补回收笔
          mx.globalCompositeOperation = 'destination-out';
          mx.setTransform(1, 0, 0, 1, 0, 0);
          mx.drawImage(rtC, 0, 0);
          mx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);
          mx.globalCompositeOperation = 'lighter';
          if (rp > N.rspN) stroke(mx, N.RING2, seg(rp - N.rspN, 1 - N.rspN), PEN, true);
          // 遮罩里只留笔迹扫过的标志像素
          mx.globalCompositeOperation = 'source-in';
          mx.drawImage(logo, 0, 0, DATA.w, DATA.h);
          mx.globalCompositeOperation = 'source-over';
          mx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(mc, LX, LY, LW, LH);
        }

        function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function render(now) {
          var st = getComputedStyle(el);
          var PRI = st.getPropertyValue('--c-pri').trim();
          ctx.fillStyle = st.getPropertyValue('--c-bg').trim();
          ctx.fillRect(0, 0, vw, vh);
          noise(REDUCED ? 0 : (now - t0) / 1000, PRI, st.getPropertyValue('--c-cell').trim());
          if (failed) return;                                  // 没有标志可画，留噪点就行
          var prog = REDUCED ? 1 : (ready ? Math.min(Math.max((now - drawT0) / DRAW_LEN, 0), 1) : 0);
          drawMark(ease(prog));
          // 减弱动效没有"画完"时刻，标签跟定格帧一起亮
          lbl.style.opacity = prog < 1 ? 0
            : REDUCED ? (ready ? 1 : 0)
            : Math.min((now - drawT0 - DRAW_LEN) / 400, 1);
        }

        // 主循环跟 rAF 原生 60fps：笔头推进的顺滑靠帧率扛（模块编译不在主线程抢饭）
        var removed = false, frozen = false;
        function frame(now) {
          if (removed) return;
          requestAnimationFrame(frame);
          if (REDUCED && frozen) return;              // 减弱动效：定格帧已画上，退场靠 CSS 淡出
          render(now);
          // 图到齐的这一帧已把完整标志（或 failed 的纯噪点）画上，之后定格
          if (REDUCED && (ready || failed)) frozen = true;
        }
        function onResize() { layout(); frozen = false; }
        layout();
        addEventListener('resize', onResize);
        requestAnimationFrame(frame);

        // 放行协议：应用就绪喊 __wiibSplashDone。等笔画完再站 0.35s（画到一半被撤掉更难看）；
        // 图还没到就先记账、到了再收（hold 此刻才算得准，早算会切半），最长 6s 强制放行——
        // 接口挂了也不能一直遮着页面
        var fired = false, pending = false;
        function finish(force) {
          if (fired) return;
          if (!force && !ready && !failed) { pending = true; return; }
          fired = true;
          var hold = (failed || !ready) ? 0
            : Math.max(0, drawT0 + DRAW_LEN + 350 - performance.now());
          setTimeout(function () {
            el.classList.add('sp-out');
            setTimeout(function () {
              removed = true;
              removeEventListener('resize', onResize);
              el.remove();
            }, 700);
          }, REDUCED ? Math.min(hold, 600) : hold);
        }
        window.__wiibSplashDone = finish;
        setTimeout(function () { finish(true); }, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
