<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <!-- ===== 开屏动画（网格溶解）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #f6f6f4 }
      html.dark { background: #0b0c0f }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --c-bg: #f6f6f4; --c-fg: #17181a; --c-line: #e4e4df;
        --c-pri: #f97316; --c-cell: #ececea; --c-mut: #71737b;
        /* 溶解延迟/呼吸相位的兜底：真值由下方 JS 逐格内联覆写 */
        --d: 0s; --bd: 0s;
      }
      html.dark #splash {
        --c-bg: #0b0c0f; --c-fg: #eceef0; --c-line: #23262e;
        --c-pri: #f97316; --c-cell: #181b21; --c-mut: #878b96;
      }
      /* 溶解一开始就放行点击，别让残留的 1s 挡住首屏操作 */
      #splash.sp-out { pointer-events: none }

      #sp-grid { position: absolute; inset: 0; display: grid }
      /* 只画右边和下边，相邻格不叠成 2px 粗线 */
      .sp-c { background: var(--c-bg); box-shadow: inset -1px -1px 0 var(--c-line) }
      /* 等待态：加载慢时零星格子明暗呼吸，像终端在刷新。
         延迟 1.2s 起——加载快的话根本看不到，不打扰 */
      .sp-c.b { animation: sp-blink 2.4s ease-in-out infinite; animation-delay: calc(1.2s + var(--bd)) }
      @keyframes sp-blink { 0%,100% { background: var(--c-bg) } 50% { background: var(--c-cell) } }
      /* 溶解：写在 blink 之后，同权重后来居上，直接顶掉呼吸 */
      #splash.sp-out .sp-c {
        animation: sp-gone .4s cubic-bezier(.4,0,.3,1) both; animation-delay: var(--d);
      }
      @keyframes sp-gone { to { opacity: 0; transform: scale(.82) } }

      .sp-mid {
        position: absolute; left: 50%; top: 50%; translate: -50% -50%;
        text-align: center; font-family: system-ui, "Microsoft YaHei", sans-serif;
      }
      #splash.sp-out .sp-mid { animation: sp-fade .45s .18s ease both }
      @keyframes sp-fade { to { opacity: 0; transform: translateY(-14px) } }

      /* 字标走 SVG 描边：@fontsource 跟 bundle 一起到，这时候用文字必然 fallback 走形 */
      .sp-wm { display: block; width: 190px; height: auto }
      .sp-p {
        fill: none; stroke: var(--c-fg); stroke-width: 6;
        stroke-linecap: square; stroke-linejoin: miter;
        stroke-dasharray: 100; stroke-dashoffset: 100;
        animation: sp-draw .42s cubic-bezier(.5,0,.3,1) both;
        animation-delay: calc(.2s + var(--i) * .06s);
      }
      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      .sp-dot {
        fill: var(--c-pri); opacity: 0; transform: scale(.2);
        transform-origin: 165px 48px;
        animation: sp-dot .3s .54s cubic-bezier(.34,1.56,.64,1) both;
      }
      @keyframes sp-dot { to { opacity: 1; transform: scale(1) } }

      .sp-lbl {
        margin-top: 18px; font-size: 10px; letter-spacing: .12em; font-weight: 700;
        color: var(--c-mut); opacity: 0; animation: sp-in .5s .78s ease both;
      }
      .sp-lbl b { color: var(--c-pri) }
      .sp-wide { display: none; font-style: normal }
      @keyframes sp-in { to { opacity: 1 } }

      @media (min-width: 768px) {
        .sp-wm { width: 300px }
        .sp-lbl { margin-top: 22px }
        .sp-wide { display: inline }
      }

      /* 减弱动效：不做逐格溶解和书写，整块淡出即可——但绝不能不显示，
         否则白屏又回来了 */
      @media (prefers-reduced-motion: reduce) {
        .sp-c, #splash.sp-out .sp-c, .sp-p, .sp-dot, .sp-lbl, #splash.sp-out .sp-mid {
          animation: none !important;
        }
        .sp-p { stroke-dashoffset: 0 }
        .sp-dot { opacity: 1; transform: none }
        .sp-lbl { opacity: 1 }
        #splash { transition: opacity .35s ease }
        #splash.sp-out { opacity: 0 }
      }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#13151a' : '#ffffff');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 开屏放在 #root 前：解析到就上屏，不等 bundle。格子多，交给紧随其后的内联脚本生成 -->
    <div id="splash" aria-hidden="true">
      <div id="sp-grid"></div>
      <div class="sp-mid">
        <svg class="sp-wm" viewBox="0 0 176 60">
          <path class="sp-p" style="--i:0" pathLength="100" d="M8 8 L19 52 L33 22 L47 52 L58 8"/>
          <path class="sp-p" style="--i:1" pathLength="100" d="M76 8 L76 52"/>
          <path class="sp-p" style="--i:2" pathLength="100" d="M94 8 L94 52"/>
          <path class="sp-p" style="--i:3" pathLength="100" d="M112 52 L112 8 L138 8 L146 16 L146 23 L139 30 L112 30"/>
          <path class="sp-p" style="--i:4" pathLength="100" d="M112 30 L140 30 L148 38 L148 45 L140 52 L112 52"/>
          <rect class="sp-dot" x="160" y="43" width="10" height="10"/>
        </svg>
        <div class="sp-lbl">GRID ONLINE <b>·</b> 数据接入中</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var grid = document.getElementById('sp-grid');
        var pc = innerWidth >= 768;   // 768 对齐 index.css 的 md: 断点

        // 格子尽量接近正方：按目标边长反推行列。两头夹住，超宽屏别爆出几百个元素
        var t = pc ? 92 : 66;
        var cols = Math.max(4, Math.min(18, Math.round(innerWidth / t)));
        var rows = Math.max(5, Math.min(12, Math.round(innerHeight / t)));
        grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
        grid.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';

        var buf = '', cx = (cols - 1) / 2, cy = (rows - 1) / 2;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            // 宽屏从中心向外辐射铺得开；手机竖长，自上而下逐行更顺眼
            var d = pc
              ? Math.hypot((c - cx) / cx, (r - cy) / cy) * 0.36
              : r * 0.045 + (c % 3) * 0.02;
            var st = '--d:' + d.toFixed(3) + 's';
            var blink = Math.random() < 0.12;   // 零星几格参与等待呼吸
            if (blink) st += ';--bd:' + (Math.random() * 2).toFixed(2) + 's';
            buf += '<span class="sp-c' + (blink ? ' b' : '') + '" style="' + st + '"></span>';
          }
        }
        grid.innerHTML = buf;

        // 网页拿不到真实加载百分比，只有"好了/没好"一个布尔信号，所以不做假进度条。
        // 最短 950ms 等字标写完（加载太快时闪一下更难看），最长 6s 强制放行——
        // 接口挂了也不能一直遮着人家页面
        var t0 = Date.now(), fired = false;
        function finish() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            el.classList.add('sp-out');
            setTimeout(function () { el.remove(); }, 1000);
          }, Math.max(0, 950 - (Date.now() - t0)));
        }
        window.__wiibSplashDone = finish;
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
