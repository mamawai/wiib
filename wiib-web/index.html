<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <!-- ===== 开屏动画（噪点场 + 像素块随机点亮拼字）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #f6f6f4 }
      html.dark { background: #0b0c0f }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --c-bg: #f6f6f4; --c-fg: #17181a; --c-cell: #dfdfd7;
        --c-pri: #f97316; --c-mut: #71737b;
      }
      html.dark #splash {
        --c-bg: #0b0c0f; --c-fg: #eceef0; --c-cell: #1b1f27;
        --c-pri: #f97316; --c-mut: #878b96;
      }
      /* 退场：字标格随机熄灭由 JS 画，整体淡出交给 CSS；退场一开始就放行点击 */
      #splash.sp-out { pointer-events: none; opacity: 0; transition: opacity .5s ease }

      /* 一张 canvas 全包：不透明底色遮页面 + 背景噪点 + 字标格，同一介质同一张格 */
      #sp-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block }

      .sp-lbl {
        position: absolute; left: 50%; translate: -50%; white-space: nowrap;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        font-size: 10px; letter-spacing: .12em; font-weight: 700;
        color: var(--c-mut); opacity: 0; animation: sp-in .5s .95s ease both;
      }
      .sp-lbl b { color: var(--c-pri) }
      @keyframes sp-in { to { opacity: 1 } }

      /* 减弱动效：噪点不漂、字标不闪直接满亮（JS 认同一媒体查询），
         退场整块淡出——但绝不能不显示，否则白屏又回来了 */
      @media (prefers-reduced-motion: reduce) {
        .sp-lbl { animation: none; opacity: 1 }
      }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#13151a' : '#ffffff');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 开屏放在 #root 前：解析到就上屏，不等 bundle。画面交给紧随其后的内联脚本绘制 -->
    <div id="splash" aria-hidden="true">
      <canvas id="sp-cv"></canvas>
      <div class="sp-lbl">GRID ONLINE <b>·</b> 数据接入中</div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var cv = document.getElementById('sp-cv');
        var ctx = cv.getContext('2d');
        if (!ctx) {
          // canvas 拿不到就别演了：定个短时限撤掉遮罩，绝不能挡住应用
          window.__wiibSplashDone = function () {};
          setTimeout(function () { el.remove(); }, 400);
          return;
        }
        var vw = innerWidth, vh = innerHeight;
        cv.width = vw; cv.height = vh;           // 大像素本就要糙，1x 分辨率足够

        // 配色从 #splash 的 CSS 变量取一次：主题在 head 里已定，中途不会变
        var st = getComputedStyle(el);
        var BG = st.getPropertyValue('--c-bg').trim();
        var FG = st.getPropertyValue('--c-fg').trim();
        var CELL = st.getPropertyValue('--c-cell').trim();
        var PRI = st.getPropertyValue('--c-pri').trim();
        var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

        var C = vw >= 768 ? 9 : 6;               // 大像素边长，768 对齐 index.css 的 md: 断点
        var cols = Math.ceil(vw / C), rows = Math.ceil(vh / C);

        function hs(x, y) { var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
        function smo(t) { return t * t * (3 - 2 * t); }
        // 双线性插值的 value noise：噪点成团不成雪花
        function vn(x, y) {
          var xi = Math.floor(x), yi = Math.floor(y), xf = smo(x - xi), yf = smo(y - yi);
          return (hs(xi, yi) * (1 - xf) + hs(xi + 1, yi) * xf) * (1 - yf)
               + (hs(xi, yi + 1) * (1 - xf) + hs(xi + 1, yi + 1) * xf) * yf;
        }

        // 字标量化：离屏 3x 超采样描边（路径同旧版 SVG 字标），按覆盖率取格。
        // 手机屏窄，字标占屏宽 82% 才有足够格数撑住字形
        var PATHS = [
          'M8 8 L19 52 L33 22 L47 52 L58 8', 'M76 8 L76 52', 'M94 8 L94 52',
          'M112 52 L112 8 L138 8 L146 16 L146 23 L139 30 L112 30',
          'M112 30 L140 30 L148 38 L148 45 L140 52 L112 52'];
        var wpx = vw >= 768 ? Math.min(vw * 0.6, 500) : vw * 0.82;
        var wc = Math.round(wpx / C), hc = Math.round(wc * 60 / 176), SS = 3;
        var off = document.createElement('canvas');
        off.width = wc * SS; off.height = hc * SS;
        var oc = off.getContext('2d', { willReadFrequently: true });
        oc.scale(wc * SS / 176, hc * SS / 60);
        oc.lineWidth = 9;                        // 比原描边 6 加粗：量化后笔画才有 2~3 格厚
        oc.lineCap = 'square'; oc.lineJoin = 'miter'; oc.strokeStyle = '#fff';
        for (var pi = 0; pi < PATHS.length; pi++) oc.stroke(new Path2D(PATHS[pi]));
        var img = oc.getImageData(0, 0, wc * SS, hc * SS).data;
        var cells = [], i, p;
        for (var yy = 0; yy < hc; yy++)
          for (var xx = 0; xx < wc; xx++) {
            var cov = 0;
            for (var sy = 0; sy < SS; sy++)
              for (var sx = 0; sx < SS; sx++)
                if (img[((yy * SS + sy) * wc * SS + xx * SS + sx) * 4 + 3] > 127) cov++;
            if (cov >= 5) cells.push({ cx: xx, cy: yy, o: 0 });   // 过半覆盖才算字格
          }
        // 橙点定死 2x2 格：右对齐 B 之后，底边压字底线（56.5 = 52 + 半个描边宽）
        var dcx = Math.floor(167 / 176 * wc) - 1, dcy = Math.floor(56.5 / 60 * hc) - 1;
        for (var dy = 0; dy < 2; dy++)
          for (var dx = 0; dx < 2; dx++)
            cells.push({ cx: dcx + dx, cy: dcy + dy, o: 1 });
        // 按量化后实际内容的包围盒居中：路径右侧给点留了空，按框居中字母会偏左
        var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        for (i = 0; i < cells.length; i++) {
          p = cells[i];
          x0 = Math.min(x0, p.cx); x1 = Math.max(x1, p.cx);
          y0 = Math.min(y0, p.cy); y1 = Math.max(y1, p.cy);
        }
        var ox = Math.round((cols - (x1 - x0 + 1)) / 2) - x0;
        var oy = Math.round((rows - (y1 - y0 + 1)) / 2 - 16 / C) - y0;   // 略高于中心，给标签留位
        for (i = 0; i < cells.length; i++) {
          p = cells[i];
          p.cx += ox; p.cy += oy;
          p.onT = 0.1 + Math.random() * 0.9;     // 原地随机时刻点亮，无序中拼出整字
          p.offT = Math.random() * 0.35;         // 退场随机熄灭
        }
        el.querySelector('.sp-lbl').style.top = ((y1 + oy + 1) * C + 22) + 'px';

        // 主循环 30fps 上限：开屏期正在解析 bundle，别抢主线程
        var t0 = performance.now(), prev = 0, exitFrom = -1, removed = false, drawn = false;
        function draw(now) {
          if (removed) return;
          requestAnimationFrame(draw);
          if (now - prev < 33) return;
          prev = now;
          if (REDUCED && drawn) return;          // 减弱动效：一帧定格，退场靠 CSS 淡出
          drawn = true;
          var t = (now - t0) / 1000, ft = REDUCED ? 0 : t;
          ctx.fillStyle = BG; ctx.fillRect(0, 0, vw, vh);
          // 背景噪点场：缓慢漂移，中心静音把舞台让给字标
          for (var ry = 0; ry < rows; ry++) {
            var y = ry * C, nyc = y / vh - 0.5;
            for (var rx = 0; rx < cols; rx++) {
              var n = vn(rx * 0.10 - ft * 0.55, ry * 0.16);
              if (n < 0.60) continue;
              var a = Math.min((n - 0.60) / 0.40, 1) * 0.85;
              var cd = Math.hypot(rx * C / vw - 0.5, nyc);
              a *= 0.22 + 0.78 * smo(Math.min(Math.max((cd - 0.16) / 0.30, 0), 1));
              ctx.globalAlpha = a;
              ctx.fillStyle = hs(rx * 3.7, ry * 9.1) > 0.995 ? PRI : CELL;  // 千分之五的橙点提神
              ctx.fillRect(rx * C, y, C - 1, C - 1);   // 留 1px 缝，颗粒清爽
            }
          }
          // 字标格：到点翻实色；退场随机熄灭
          var et = exitFrom >= 0 ? (now - exitFrom) / 1000 : -1;
          for (var j = 0; j < cells.length; j++) {
            var q = cells[j];
            if (!REDUCED && t < q.onT) continue;
            if (!REDUCED && et >= 0 && et > q.offT) continue;
            var k = REDUCED ? 1 : Math.min((t - q.onT) / 0.12, 1);
            ctx.globalAlpha = 0.45 + 0.55 * k;
            ctx.fillStyle = q.o ? PRI : FG;
            ctx.fillRect(q.cx * C, q.cy * C, C - 1, C - 1);
          }
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(draw);

        // 放行协议不变：应用就绪喊 __wiibSplashDone。最短 1.9s 让字拼完站一会
        // （加载快时闪一下更难看），最长 6s 强制放行——接口挂了也不能一直遮着页面
        var fired = false;
        function finish() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            exitFrom = performance.now();
            el.classList.add('sp-out');
            setTimeout(function () { removed = true; el.remove(); }, 700);
          }, Math.max(0, 1900 - (performance.now() - t0)));
        }
        window.__wiibSplashDone = finish;
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
