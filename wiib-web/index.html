<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <!-- ===== 开屏动画（噪点场 + 两笔同时画出标志）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #f6f6f4 }
      html.dark { background: #0b0c0f }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --c-bg: #f6f6f4; --c-cell: #dfdfd7;
        --c-pri: #f97316; --c-mut: #71737b;
      }
      html.dark #splash {
        --c-bg: #0b0c0f; --c-cell: #1b1f27;
        --c-pri: #f97316; --c-mut: #878b96;
      }
      /* 退场：整块淡出，一开始就放行点击 */
      #splash.sp-out { pointer-events: none; opacity: 0; transition: opacity .5s ease }

      /* 一张 canvas 全包：不透明底色遮页面 + 背景噪点 + 标志，同一介质 */
      #sp-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block }

      /* 标签的淡入由 JS 在画完后驱动，位置也由 JS 定（要贴着标志下沿） */
      .sp-lbl {
        position: absolute; left: 50%; translate: -50%; white-space: nowrap;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        font-size: 10px; letter-spacing: .12em; font-weight: 700;
        color: var(--c-mut); opacity: 0;
      }
      .sp-lbl b { color: var(--c-pri) }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 语言也得在这儿定：开屏跑在 bundle 之前，i18n 还不存在，但开屏上有话要说。
        // 判定复刻 src/i18n/index.ts 那套（localStorage 的 wiib-lang 优先，没选过就看
        // 浏览器语言、zh-* 算中文其余算英文），两处必须同规则，否则开屏与应用会说两种语言
        var lang = localStorage.getItem('wiib-lang');
        if (lang !== 'zh' && lang !== 'en') {
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          lang = nav.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }
        window.__wiibLang = lang;
        // 标签页语言从第一帧就对：浏览器断词与读屏软件都认它（bundle 起来后 i18n 会接着维护）
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#13151a' : '#ffffff');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 开屏放在 #root 前：解析到就上屏，不等 bundle。画面交给紧随其后的内联脚本绘制 -->
    <div id="splash" aria-hidden="true">
      <canvas id="sp-cv"></canvas>
      <!-- 后半句由下面的脚本按语言填（标签 opacity:0 起手、画完才淡入，填之前看不见） -->
      <div class="sp-lbl">GRID ONLINE <b>·</b> <span id="sp-tail"></span></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var cv = document.getElementById('sp-cv');
        var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
        var lbl = el.querySelector('.sp-lbl');
        el.querySelector('#sp-tail').textContent =
          window.__wiibLang === 'zh' ? '数据接入中' : 'LINKING FEEDS';
        if (!ctx) {
          // canvas 拿不到就别演了：定个短时限撤掉遮罩，绝不能挡住应用
          window.__wiibSplashDone = function () {};
          setTimeout(function () { el.remove(); }, 400);
          return;
        }

        // ===== 笔画数据：离线从 logo.png 的 alpha 抽中轴线得来，坐标在 505×265 的标志像素空间 =====
        // left / right 从飘带中间那两个断头起笔，各绕半圈，同时收在斜杠正中的会合点；
        // blade 是 b 竖杆，右笔走到 fork 处分叉出去，与主笔同速并行。
        // 画法是「反向遮罩」：笔迹只当遮罩，最终像素取自真 logo.png——画出来的是真标志，不是重绘的近似形。
        var DATA = {"w":505,"h":265,"pen":80.0,"fork":0.307,"lsp":0.833,"rsp":0.832,"ew":58.0,"e":"189,213 198,213 207,209 214,205 220,198 225,191 229,183 234,175 238,167 241,159 245,151 248,142 252,134 255,126 259,118 263,109 267,101 271,93 276,86","left":"218,122 217,117 217,112 217,107 217,102 217,97 216,92 216,87 216,82 215,77 215,72 212,68 209,64 206,61 202,57 198,54 194,51 190,47 186,45 182,42 178,40 173,37 169,35 164,34 159,32 154,31 149,31 144,30 139,29 134,29 129,28 125,29 120,29 115,30 110,31 105,32 100,33 95,34 90,36 86,38 81,40 77,43 73,45 69,48 65,51 61,55 58,58 54,62 51,66 48,70 45,74 42,78 40,83 38,87 36,92 34,96 33,101 32,106 31,111 30,116 29,121 29,126 28,131 28,136 29,141 30,146 30,151 31,156 32,160 33,165 35,170 37,175 38,179 41,184 43,188 45,193 48,197 51,201 54,205 58,208 63,210 68,211 72,213 77,213 82,211 87,210 91,208 96,205 99,201 101,197 103,192 106,188 108,183 110,179 113,175 116,171 120,168 124,165 129,163 133,162 138,162 143,165 147,167 152,169 155,173 157,177 160,182 162,186 164,191 166,195 169,199 172,204 175,207 180,209 184,211 189,213 194,214 199,212 203,211 208,209 213,207 216,203 219,199 222,195 225,191 227,187 230,182 232,178 235,174 237,169 239,165 241,160 243,156","right":"285,151 285,156 285,161 286,166 286,171 286,176 287,181 287,186 288,191 288,196 291,200 295,204 298,207 302,210 306,214 310,217 314,219 318,222 323,224 327,227 332,229 337,230 341,231 346,233 351,233 356,234 361,235 366,235 371,236 376,236 381,235 386,234 391,234 396,233 401,232 405,230 410,229 415,227 419,225 424,223 428,220 431,216 433,211 435,207 437,202 439,198 444,195 448,193 452,190 455,186 459,182 462,178 464,174 467,170 469,165 470,160 472,156 472,151 473,146 474,141 474,136 474,131 474,126 473,121 472,116 472,111 471,106 470,101 469,96 467,92 465,87 463,82 461,78 458,74 455,70 452,66 449,62 445,58 441,55 437,52 433,50 429,47 424,46 419,44 414,43 409,42 405,41 400,40 395,39 390,38 385,38 380,37 375,36 370,36 365,37 360,38 356,40 351,42 347,45 343,48 338,50 333,51 328,52 324,53 319,55 314,56 309,58 304,59 300,61 295,62 291,65 288,69 285,73 282,77 279,81 276,86 274,90 271,94 268,98 266,103 264,107 262,112 260,116 258,121 256,125 254,130 252,135 250,139 248,144 246,148 244,153 243,156","blade":"427,217 424,214 420,210 417,207 413,203 409,200 411,196 415,193 418,189 416,185 411,185 406,185 401,185 396,185 391,185 386,185 381,183 377,182 372,180 368,177 364,174 360,171 357,167 353,164 350,159 348,155 345,151 344,146 342,141 341,136 340,132 339,127 338,122 338,117 337,112 337,107 337,102 337,97 337,92 337,87 337,82 337,77 338,72 339,67 340,62 341,57 340,52","bx":310,"by":49,"bw":128,"bh":172,"bm":"iVBORw0KGgoAAAANSUhEUgAAAIAAAACsCAYAAACzUKSGAAAC1ElEQVR42u3dS1bDMBAEQI8e97/ysGWTPAhxPFZXb9jGUrklf0iO49r0IZdmDZh8CC5MDTvzy5Ts3wBtSchtgL5JQwEwcMMHw2abwFcAWSJu2gC90QYWgGHX+iAMHrwOuKQFYNglHQgDNoFXbtZsFC8GMGECILgIwKSBh+DD62W73M1tgOlnmzY4EcBdBheCm98KhmAggIYgF0BrglwAOwwgBC8C2GngGgAD1gAYqAbAAAEQPvkNgEFpAASA8HW/Acje9BUAJj8aQJv8XAAmPxiAydcAJj8VgFu9GsDZD4DJB8DkAyAAOPsBEACc/QBIAIB29msAAcDZD4AAIAAIANZ/AAQAAUD9AyAACAACgAAgAAgALgEBEAAEAAFAABAABAABQAAQAAQAAUAAEAAO3/gNgAAgowF4eUIDCAACgADgUhAASQTgSkADCAD2AQAIAFogFICNoAYQACwDAEgugNICGkAA0ALJAFwOagAtAIBEAygtoAEsBQBIMoDSAhrAUhAOoCDQAJoAAAiSARQEGkAThAMoCDSAJggHUBDsd0waIA9B//y7/BbPnwaud4OsATLa4CHeUonH7r9O1mccAADzIfTZHxyCmRD6kx8YgjkQXpmL+jJXp09GTd6QlmvkW7XDu8e6yo2SbIzuAxzeCfRr3QBAAAAEAEAAgACgBZLuR6zwJ2UawONSADwzD74dvbw4oQG8PQMABABAEPk4enmHTgN4kRIACFLfRlrepNUAXqcOfhdxDfuAIHgcDMEnx3T5xwoNMFktCN4IguDM8Vs3OggQnF2H/0R68/yuGx+YRrC+aoT/zm35/p7sE3tteOCWBpdY8a1QAGRjAACIzE3gVBR1ATYAwlvmV3PrW8LClxUAwvcSAIRvHgEIv3T0DSH7Tn4D4E6pAwxvh9IAfixCA4Q3QmkAj6I1gFvCAKSCAACIx/MMwP4oNEAwDPPrp22f5xvbPngx44FR7QAAAABJRU5ErkJggg=="};
        function parse(s) {
          var a = s.split(' '), r = [], i, p;
          for (i = 0; i < a.length; i++) { p = a[i].split(','); r.push([+p[0], +p[1]]); }
          return r;
        }
        var LEFT = parse(DATA.left), RIGHT = parse(DATA.right), BLADE = parse(DATA.blade);
        var EZ = parse(DATA.e);                       // 禁区中线：交叉附近那段斜杠
        var SPAN_B = BLADE.length / LEFT.length;      // 等间距重采样，点数比 = 长度比 = 同笔速的时长比
        // 按「进入禁区」切两截：前半截禁止画进斜杠带（笔帽半径 40，而断头离斜杠中线只有 36，
        // 不挡就会横向啃进斜杠，一落笔先亮出中间），后半截笔已走在斜杠上，放开画
        function cut(a, f) {
          var k = Math.max(0, Math.round(f * (a.length - 1)));
          return [a.slice(0, Math.max(2, k + 1)), a.slice(k)];
        }
        var L = cut(LEFT, DATA.lsp), R = cut(RIGHT, DATA.rsp);
        var L1 = L[0], L2 = L[1], R1 = R[0], R2 = R[1];
        var PEN = DATA.pen;

        var logo = new Image(), bmask = new Image(), loaded = 0, ready = false, failed = false, drawT0 = 0;
        var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var DRAW_START = 200, DRAW_LEN = 1800;        // 毫秒：等噪点铺开一瞬再落笔 / 画完用时
        var t0 = performance.now();
        function onload() {
          if (++loaded < 2) return;
          ready = true;
          drawT0 = Math.max(t0 + DRAW_START, performance.now());
        }
        logo.onload = onload; bmask.onload = onload;
        logo.onerror = bmask.onerror = function () { failed = true; };   // 图挂了就只留噪点，尽快放行
        logo.src = '/logo.png';
        // 竖杆归属遮罩：环和竖杆的像素互相交错（环侧有像素离竖杆中线只有 13px），
        // 统一宽度的禁区分不开，只能按像素归属精确切。已二值化——半透明边会抠不干净留淡痕
        bmask.src = 'data:image/png;base64,' + DATA.bm;

        var vw, vh, C, cols, rows, dpr, mc, mx, bc, bx, LW, LH, LX, LY, SC;
        function layout() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          vw = innerWidth; vh = innerHeight;
          cv.width = vw * dpr; cv.height = vh * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          C = vw >= 768 ? 9 : 6;                      // 大像素边长，768 对齐 index.css 的 md 断点
          cols = Math.ceil(vw / C); rows = Math.ceil(vh / C);
          LW = vw >= 768 ? Math.min(vw * 0.42, 460) : vw * 0.72;
          SC = LW / DATA.w; LH = DATA.h * SC;
          LX = (vw - LW) / 2; LY = (vh - LH) / 2 - 14;
          if (!mc) {
            mc = document.createElement('canvas'); mx = mc.getContext('2d');
            bc = document.createElement('canvas'); bx = bc.getContext('2d');
          }
          mc.width = Math.ceil(LW * dpr); mc.height = Math.ceil(LH * dpr);
          bc.width = Math.ceil(DATA.bw * SC * dpr); bc.height = Math.ceil(DATA.bh * SC * dpr);
          lbl.style.top = (LY + LH + 26) + 'px';
        }

        // ---- 背景噪点场 ----
        function hs(x, y) { var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
        function smo(t) { return t * t * (3 - 2 * t); }
        function vn(x, y) {
          var xi = Math.floor(x), yi = Math.floor(y), xf = smo(x - xi), yf = smo(y - yi);
          return (hs(xi, yi) * (1 - xf) + hs(xi + 1, yi) * xf) * (1 - yf)
               + (hs(xi, yi + 1) * (1 - xf) + hs(xi + 1, yi + 1) * xf) * yf;
        }
        function noise(t, PRI, CELL) {
          for (var ry = 0; ry < rows; ry++) {
            var y = ry * C, nyc = y / vh - 0.5;
            for (var rx = 0; rx < cols; rx++) {
              var n = vn(rx * 0.10 - t * 0.55, ry * 0.16);
              if (n < 0.60) continue;
              var a = Math.min((n - 0.60) / 0.40, 1) * 0.85;
              var cd = Math.hypot(rx * C / vw - 0.5, nyc);
              a *= 0.22 + 0.78 * smo(Math.min(Math.max((cd - 0.16) / 0.30, 0), 1));
              ctx.globalAlpha = a;
              ctx.fillStyle = hs(rx * 3.7, ry * 9.1) > 0.995 ? PRI : CELL;   // 千分之五的橙点提神
              ctx.fillRect(rx * C, y, C - 1, C - 1);                        // 留 1px 缝，颗粒清爽
            }
          }
          ctx.globalAlpha = 1;
        }

        // ---- 把折线画到 p（0~1）处 ----
        function stroke(g, pts, p, w) {
          if (p <= 0) return;
          var n = pts.length - 1, f = Math.min(p, 1) * n, i = Math.floor(f), r = f - i, k;
          g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#000';
          g.beginPath();
          g.moveTo(pts[0][0], pts[0][1]);
          for (k = 1; k <= Math.min(i, n); k++) g.lineTo(pts[k][0], pts[k][1]);
          // 末点落在两个采样点中间，补一段到插值位置——否则笔迹是逐点跳不是连续推进
          if (i < n) g.lineTo(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
          g.stroke();
        }

        function seg(p, f) { return f <= 0 ? 1 : Math.min(p / f, 1); }

        function drawMark(prog) {
          if (!logo.naturalWidth) return;
          mx.setTransform(1, 0, 0, 1, 0, 0);
          mx.clearRect(0, 0, mc.width, mc.height);
          mx.setTransform(SC * dpr, 0, 0, SC * dpr, 0, 0);   // 换算到标志像素空间
          var i, pb, s2;
          // ① 两支笔的前半截：都在禁区之外
          stroke(mx, L1, seg(prog, DATA.lsp), PEN);
          stroke(mx, R1, seg(prog, DATA.rsp), PEN);
          // ② 抠掉两块禁区：交叉附近那段斜杠带（平头收口，不顺中线两端多啃）+ 竖杆的全部像素
          mx.globalCompositeOperation = 'destination-out';
          mx.lineWidth = DATA.ew; mx.lineCap = 'butt'; mx.lineJoin = 'round'; mx.strokeStyle = '#000';
          mx.beginPath();
          mx.moveTo(EZ[0][0], EZ[0][1]);
          for (i = 1; i < EZ.length; i++) mx.lineTo(EZ[i][0], EZ[i][1]);
          mx.stroke();
          mx.drawImage(bmask, DATA.bx, DATA.by, DATA.bw, DATA.bh);
          // 抠完禁区后一律加性叠加：遮罩边是半透明的，被抠那层剩 (1-a)、补回那层是 a，
          // source-over 叠出来只有 1-a+a**2（最低 0.75）——亮底看不出，暗底就是一条黑裂纹
          mx.globalCompositeOperation = 'lighter';

          //    笔加宽 20%——竖杆最外侧像素离中线 39px，笔半径 40 刚好压线，遮罩又外扩 1px，
          //    不加宽会沿边留一道没盖到的白丝；反正被遮罩裁着，宽点无害
          pb = (prog - DATA.fork) / SPAN_B;
          if (pb > 0) {
            s2 = SC * dpr;
            bx.setTransform(1, 0, 0, 1, 0, 0);
            bx.clearRect(0, 0, bc.width, bc.height);
            bx.setTransform(s2, 0, 0, s2, -DATA.bx * s2, -DATA.by * s2);
            stroke(bx, BLADE, pb, PEN * 1.2);
            bx.setTransform(1, 0, 0, 1, 0, 0);
            bx.globalCompositeOperation = 'destination-in';
            bx.drawImage(bmask, 0, 0, bc.width, bc.height);
            bx.globalCompositeOperation = 'source-over';
            mx.drawImage(bc, DATA.bx, DATA.by, DATA.bw, DATA.bh);
          }
          // ④ 后半截：笔已走在斜杠上，放开画进禁区，两笔在这里会合
          if (prog > DATA.lsp) stroke(mx, L2, seg(prog - DATA.lsp, 1 - DATA.lsp), PEN);
          if (prog > DATA.rsp) stroke(mx, R2, seg(prog - DATA.rsp, 1 - DATA.rsp), PEN);
          // 遮罩里只留笔迹扫过的标志像素
          mx.globalCompositeOperation = 'source-in';
          mx.drawImage(logo, 0, 0, DATA.w, DATA.h);
          mx.globalCompositeOperation = 'source-over';
          mx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(mc, LX, LY, LW, LH);
        }

        function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function render(now) {
          var st = getComputedStyle(el);
          var PRI = st.getPropertyValue('--c-pri').trim();
          ctx.fillStyle = st.getPropertyValue('--c-bg').trim();
          ctx.fillRect(0, 0, vw, vh);
          noise(REDUCED ? 0 : (now - t0) / 1000, PRI, st.getPropertyValue('--c-cell').trim());
          if (failed) return;                                  // 没有标志可画，留噪点就行
          var prog = REDUCED ? 1 : (ready ? Math.min(Math.max((now - drawT0) / DRAW_LEN, 0), 1) : 0);
          drawMark(ease(prog));
          lbl.style.opacity = prog >= 1 ? Math.min((now - drawT0 - DRAW_LEN) / 400, 1) : 0;
        }

        // 主循环 30fps 上限：开屏期正在解析 bundle，别抢主线程
        var prev = 0, removed = false, drawn = false;
        function frame(now) {
          if (removed) return;
          requestAnimationFrame(frame);
          if (now - prev < 33) return;
          prev = now;
          if (REDUCED && drawn && ready) return;      // 减弱动效：图一到就定格一帧，退场靠 CSS 淡出
          drawn = true;
          render(now);
        }
        layout();
        addEventListener('resize', function () { layout(); drawn = false; });
        requestAnimationFrame(frame);

        // 放行协议：应用就绪喊 __wiibSplashDone。等笔画完再站 0.35s（画到一半被撤掉更难看），
        // 最长 6s 强制放行——接口挂了也不能一直遮着页面
        var fired = false;
        function finish() {
          if (fired) return;
          fired = true;
          var hold = failed ? 0
            : Math.max(0, (drawT0 || t0 + DRAW_START) + DRAW_LEN + 350 - performance.now());
          setTimeout(function () {
            el.classList.add('sp-out');
            setTimeout(function () { removed = true; el.remove(); }, 700);
          }, REDUCED ? Math.min(hold, 600) : hold);
        }
        window.__wiibSplashDone = finish;
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
